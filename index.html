<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#246650"><title>כסף מאמא</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main><header><a class="brand" href="./"><span class="brand-icon">₪</span><span>כסף מאמא<small>קצת סדר, הרבה שקט</small></span></a><button id="backup" class="quiet" type="button">גיבוי ↓</button></header>
<nav class="month-nav" aria-label="בחירת חודש"><button id="prev" aria-label="החודש הקודם">→</button><div><h1 id="month"></h1><p id="period"></p></div><button id="next" aria-label="החודש הבא">←</button></nav><button id="today" class="month-reset" hidden>חזרה לחודש הנוכחי</button>
<section class="budget" aria-label="התקציב החודשי"><div class="balance"><p id="balance-label">נשאר לך החודש</p><div class="big-number" id="remaining"></div><p>מתוך תקציב של 600 ₪</p><div id="status" class="status"></div></div><div class="ring" role="progressbar" aria-label="ניצול התקציב" aria-valuemin="0" aria-valuemax="600" aria-valuenow="0"><svg viewBox="0 0 160 160" aria-hidden="true"><circle class="track" cx="80" cy="80" r="68"/><circle id="arc" cx="80" cy="80" r="68"/></svg><div class="ring-text"><strong id="percent">0%</strong><span>מהתקציב נוצל</span></div></div><div class="budget-footer"><span>בזבזת <strong id="spent"></strong></span><span><strong id="count"></strong> קניות החודש</span></div></section>
<div class="columns"><section class="add-section"><h2>קנייה חדשה</h2><p class="subtitle">קנית משהו? הוסיפי אותו כאן.</p><form id="purchase-form"><label for="amount">כמה שילמת?</label><div class="amount-field"><input id="amount" name="amount" type="number" inputmode="decimal" min="0.01" max="999999" step="0.01" placeholder="0.00" required><span>₪</span></div><label for="store">איפה קנית?</label><input id="store" name="store" maxlength="100" placeholder="למשל, סופר־פארם" required><label for="date">תאריך הקנייה</label><input id="date" name="date" type="date" required><button class="primary" type="submit">＋ הוספת קנייה</button><p id="form-error" role="alert"></p></form></section>
<section class="purchases"><div class="section-heading"><h2>הקניות שלך</h2><span id="list-total"></span></div><div id="list"></div></section></div>
<footer><p>התקציב מתחדש בכל 1 בחודש. ההיסטוריה נשארת.</p><p>הנתונים שמורים בדפדפן הזה. כדאי להוריד גיבוי מדי פעם.</p><label class="restore">שחזור מגיבוי<input id="restore" type="file" accept="application/json,.json" hidden></label></footer></main><div id="toast" role="status" hidden><span id="toast-text"></span><button id="undo" hidden>ביטול מחיקה</button></div></body></html>
